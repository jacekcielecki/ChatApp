<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Shared styles -->
    <link
      rel="stylesheet"
      href="https://chatappst.blob.core.windows.net/entraid/styles.css"
    />

    <style>
      /* Page-specific overrides */
      .login-container {
        padding: 1rem;
        align-items: flex-start;
      }

      #api {
        max-width: 500px;
        transform: scale(0.8);
        transform-origin: top center;
      }

      #api a.helpLink {
        display: none;
      }

      #api ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }

      #api li {
        margin-top: 8px;
      }

      #api form .buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="logo-container">
      <img
        src="https://raw.githubusercontent.com/jacekcielecki/ChatApp/refs/heads/dev/deploy/logo.jpeg"
        alt="chatapp-logo"
      />
    </div>

    <div class="login-container">
      <div id="api"></div>
    </div>
  </body>
</html>
