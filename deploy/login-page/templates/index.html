<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #09B09E;
      --color-secondary: #053D3A;
      --font-family-base: "Geist", system-ui, Avenir, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: var(--font-family-base);
    }

    .logo-container {
      position: relative;
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-container {
      background: white;
      background: linear-gradient(135deg, #09B09E, #053D3A);
      width: 50%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    #api {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background-color: #053D3A;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .logo-container,
      .login-container {
        width: 100%;
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="https://raw.githubusercontent.com/jacekcielecki/ChatApp/refs/heads/dev/deploy/logo.jpeg" alt="chatapp-logo" />
  </div>
  <div class="login-container">
    <div id="api">
      <!-- B2C -->
    </div>
  </div>
</body>
</html>
