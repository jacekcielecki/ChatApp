<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-primary: #09b09e;
      --color-secondary: #053d3a;
      --font-family-base: "Geist", system-ui, Avenir, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: var(--font-family-base);
      background-color: #f5f5f5;
    }

    /* --- Layout --- */
    .logo-container {
      position: relative;
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-container {
      background: white;
      width: 50%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow-y: auto;
    }

    #api {
      width: 100%;
      max-width: 400px;
      background: white;
      text-align: center;
    }

    /* --- B2C Form Styling --- */
    #api * {
      all: unset;
      font-family: var(--font-family-base);
      box-sizing: border-box;
    }

    #api input[type="text"],
    #api input[type="email"],
    #api input[type="password"] {
      all: revert;
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 1rem;
      font-family: var(--font-family-base);
      transition: all 0.2s ease;
    }

    #api input:focus {
      border-color: var(--color-primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(9, 176, 158, 0.2);
    }

    #api label {
      display: block;
      text-align: left;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--color-secondary);
      font-size: 0.9rem;
    }

    #api button,
    #api input[type="submit"] {
      all: revert;
      width: 100%;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    #api button:hover,
    #api input[type="submit"]:hover {
      background-color: var(--color-secondary);
    }

    #api a {
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 10px;
    }

    #api a:hover {
      text-decoration: underline;
    }

    #api h1,
    #api h2 {
      color: var(--color-secondary);
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 1.6rem;
    }

    #api .error {
      color: #d32f2f;
      background: #fbe9e7;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    #api .helpLink,
    #api .verificationControl,
    #api .claims-provider-list {
      all: revert;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .logo-container,
      .login-container {
        width: 100%;
        height: 50vh;
      }
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img
      src="https://raw.githubusercontent.com/jacekcielecki/ChatApp/refs/heads/dev/deploy/logo.jpeg"
      alt="chatapp-logo"
    />
  </div>

  <div class="login-container">
    <div id="api">
      <!-- Azure AD B2C will inject the login form here -->
    </div>
  </div>
</body>
</html>
