<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <!-- Import default Azure AD B2C CSS -->
  <link rel="stylesheet" href="https://login.microsoftonline.com/static/tenant/default/styles.css" />

  <style>
    :root {
      --color-primary: #09b09e;
      --color-secondary: #053d3a;
      --font-family-base: "Geist", system-ui, Avenir, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: var(--font-family-base);
      background-color: #f5f5f5;
    }

    .logo-container {
      position: relative;
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-container {
      background: white;
      width: 50%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow-y: auto;
    }

    #api {
      width: 100%;
      max-width: 400px;
      background: white;
      text-align: center;
    }

    /* Reset some potential conflicting styles from your own CSS */
    #api * {
      all: revert;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .logo-container,
      .login-container {
        width: 100%;
        height: 50vh;
      }
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img
      src="https://raw.githubusercontent.com/jacekcielecki/ChatApp/refs/heads/dev/deploy/logo.jpeg"
      alt="chatapp-logo"
    />
  </div>

  <div class="login-container">
    <div id="api">
      <!-- Azure AD B2C injects login form here -->
    </div>
  </div>
</body>
</html>
